[project]
name = "x-crawler"
version = "0.3.0"
description = "Playwright & GraphQL-based crawler for X (Twitter) user timelines and replies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
x-crawler = "x_crawler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
